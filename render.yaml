# Render blueprint — https://render.com/docs/blueprint-spec
#
# No API key is needed: the service ships with its own Sanskrit dictionary.
# Deploy with zero configuration:  Render -> New -> Blueprint -> this repo -> Apply.
#
# Later, if you ever add OPENAI_API_KEY in the Render dashboard, the app
# automatically switches to the AI model AND turns on photo reading.

services:
  - type: web
    name: sanskrit-translator-api
    runtime: node
    # free  = 512 MB, sleeps after 15 minutes of no traffic (first request is slower)
    # starter = always on, no sleeping — better for real use
    plan: free
    # Nearest Render region to India. Others: oregon, ohio, virginia, frankfurt.
    region: singapore
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # The bundled dictionary: no key, no cost.
      - key: TRANSLATE_ENGINE
        value: free
      # "auto" = photo reading switches on only if you add OPENAI_API_KEY here.
      - key: OCR_ENGINE
        value: auto
      - key: RATE_LIMIT_PER_MINUTE
        value: "40"